name: Test basic folder listing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directories
        run: |
          mkdir -p /tmp/test-folders/alpha
          mkdir -p /tmp/test-folders/beta
          mkdir -p /tmp/test-folders/gamma

      - id: action
        uses: .
        with:
          path: /tmp/test-folders

      - name: Assert folders output contains expected directories
        env:
          ACTUAL: ${{ steps.action.outputs.folders }}
        run: |
          echo "actual: $ACTUAL"
          # Check that the output is valid JSON array
          echo "$ACTUAL" | jq -e 'type == "array"' || { echo "FAIL: output is not a JSON array"; exit 1; }
          # Check that all three folders are present
          for folder in alpha beta gamma; do
            if ! echo "$ACTUAL" | jq -e --arg f "$folder" 'index($f) != null' > /dev/null; then
              echo "FAIL: expected folder '$folder' not found in output: $ACTUAL"
              exit 1
            fi
          done
          echo "PASS"
